<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Footer | Northbridge University</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#0ea5e9',
              foreground: '#ffffff'
            },
            foreground: '#0f172a',
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="index.css" />
</head>
<body class="bg-slate-50 antialiased text-foreground flex flex-col min-h-screen">

  <!-- Spacer to push footer to the bottom for this standalone preview -->
  <div class="flex-grow"></div>

  <!-- THE ACTUAL FOOTER PARTIAL -->
  <footer class="ui-glass edge relative border-t border-white/40 mt-auto">
    <div class="mx-auto grid max-w-7xl gap-8 px-5 py-10 sm:grid-cols-2 lg:grid-cols-4 lg:px-8">

      <div>
        <div class="flex min-w-0 items-center gap-2">

            NU

          <p id="footer-uni-name" class="truncate font-display text-sm font-bold uppercase">
            Loading...
          </p>
        </div>
        <p id="footer-uni-blurb" class="mt-3 text-xs leading-relaxed text-foreground/50">
          Loading description...
        </p>
      </div>

      <!-- Quick Links -->
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.15em] text-foreground/40">
          Quick Links
        </p>
        <ul id="quick-links-list" class="mt-3 space-y-2 text-sm text-foreground/60">
          <!-- Static Sample (Will be overridden by JS) -->
          <li><a class="transition hover:text-primary" href="/verify">Verify Candidate</a></li>
        </ul>
      </div>

      <!-- Contact Info -->
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.15em] text-foreground/40">
          Contact
        </p>
        <ul class="mt-3 space-y-2 text-sm text-foreground/60">
          <li id="footer-address">Loading...</li>
          <li id="footer-phone">Loading...</li>
          <li id="footer-email">Loading...</li>
        </ul>
      </div>

      <!-- Portal Links -->
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.15em] text-foreground/40">
          Portal
        </p>
        <ul id="portal-links-list" class="mt-3 space-y-2 text-sm text-foreground/60">
          <!-- Static Sample (Will be overridden by JS) -->
          <li><a class="transition hover:text-primary" href="/">Home</a></li>
        </ul>
      </div>

    </div>

    <!-- Copyright -->
    <div class="border-t border-white/40">
      <p id="footer-copyright" class="mx-auto max-w-7xl px-5 py-4 text-center text-xs text-foreground/40 lg:px-8">
        © 2025 Loading... All rights reserved.
      </p>
    </div>
  </footer>
  <!-- END OF FOOTER PARTIAL -->

  <script src="index.js"></script>
