<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Upload | Northbridge University</title>
  <meta name="description" content="Upload your passport photograph, O'Level result, JAMB result, birth certificate, NIN slip and other required documents.">
  <meta property="og:title" content="Document Upload | Northbridge University">
  <meta property="og:description" content="Upload your passport photograph, O'Level result, JAMB result, birth certificate, NIN slip and other required documents.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="documents.css">
</head>
<body>

  <!-- [PLACEHOLDER: DashboardShell layout wrapper start] -->
  <div id="dashboard-shell-root">

    <main class="container">
      <div class="space-y-6">

        <!-- Progress Overview Card -->
        <section class="card card-elevated">
          <div class="flex-header">
            <div>
              <p class="subtitle">Documents</p>
              <h1 class="page-title">Document Upload</h1>
              <p class="section-desc">
                Upload clear scans of each required document. Files are simulated in this prototype.
              </p>
            </div>
            <span id="required-progress-badge" class="badge badge-brand">
              0/0 required uploaded
            </span>
          </div>

          <div
            id="progress-bar-container"
            class="progress-bar-bg"
            role="progressbar"
            aria-valuenow="0"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </section>

        <!-- Notification Notice -->
        <div id="notice-container" class="notice-box hidden" role="status">
          <span id="notice-text"></span>
        </div>

        <!-- Document Grid -->
        <div id="documents-grid" class="grid grid-docs">
          <!-- Rendered dynamically via documents.js -->
        </div>

        <p class="footer-note">
          Prototype only — selected files stay in your browser and are never uploaded.
        </p>

      </div>
    </main>

  </div>
  <!-- [PLACEHOLDER: DashboardShell layout wrapper end] -->

  <script src="documents.js"></script>
</body>
</html>
